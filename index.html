<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cronómetro y Cuenta Atrás</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Timer App</h1>
        <nav class="mode-selector">
          <button id="stopwatch-btn" class="nav-btn active">Cronómetro</button>
          <button id="countdown-btn" class="nav-btn">Cuenta Atrás</button>
        </nav>
      </header>

      <main>
        <!-- Cronómetro -->
        <section id="stopwatch-section" class="timer-section active">
          <div class="display-container">
            <div id="stopwatch-display" class="time-display">00:00:00.00</div>
          </div>
          <div class="controls">
            <button id="stopwatch-start" class="control-btn primary">Iniciar</button>
            <button id="stopwatch-reset" class="control-btn secondary">Reiniciar</button>
          </div>
        </section>

        <!-- Cuenta Atrás -->
        <section id="countdown-section" class="timer-section">
          <div class="display-container">
            <div id="countdown-display" class="time-display">00:00:00.00</div>
          </div>

          <!-- Input personalizado para el tiempo -->
          <div class="time-input-container">
            <div class="time-input-display">
              <span class="time-part">
                <span id="hours-input">00</span>
                <label>h</label>
              </span>
              <span class="separator">:</span>
              <span class="time-part">
                <span id="minutes-input">00</span>
                <label>m</label>
              </span>
              <span class="separator">:</span>
              <span class="time-part">
                <span id="seconds-input">00</span>
                <label>s</label>
              </span>
            </div>

            <div class="keypad">
              <button class="key-btn" data-key="1">1</button>
              <button class="key-btn" data-key="2">2</button>
              <button class="key-btn" data-key="3">3</button>
              <button class="key-btn" data-key="4">4</button>
              <button class="key-btn" data-key="5">5</button>
              <button class="key-btn" data-key="6">6</button>
              <button class="key-btn" data-key="7">7</button>
              <button class="key-btn" data-key="8">8</button>
              <button class="key-btn" data-key="9">9</button>
              <button class="key-btn zero" data-key="0">0</button>
              <button class="key-btn backspace" data-key="backspace">⌫</button>
            </div>
          </div>

          <div class="controls">
            <button id="countdown-start" class="control-btn primary">Iniciar</button>
            <button id="countdown-reset" class="control-btn secondary">Reiniciar</button>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
